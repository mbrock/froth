    var loadPromise = new Promise(function(resolve, reject) {
      img.onload = function() { resolve(this); };
      img.onerror = function() { reject('Failed to load image ' + i); };
    });
    img.src = SCENE_URLS[i];
    images.push(await loadPromise);
    status.textContent = 'Loaded image ' + (i+1) + '/' + SCENE_URLS.length;
  }
  
  // Scene timing: divide duration equally
  var sceneDuration = DURATION / images.length;
  
  // Group words into phrases (clusters with < 0.3s gap, max 6 words)
  var phrases = [];
  var currentPhrase = [];
  for (var i = 0; i < WORDS.length; i++) {
    var w = WORDS[i];
    if (currentPhrase.length === 0) {
      currentPhrase.push(w);
    } else {
      var gap = w.start - currentPhrase[currentPhrase.length-1].end;
      if (gap > 0.3 || currentPhrase.length >= 6) {
        phrases.push(currentPhrase);
        currentPhrase = [w];
      } else {
        currentPhrase.push(w);
      }
    }
  }
  if (currentPhrase.length > 0) phrases.push(currentPhrase);
  
  // Find active phrase and word for a given time
  function findActive(t) {
    for (var p = 0; p < phrases.length; p++) {
      var phrase = phrases[p];
      var pStart = phrase[0].start - 0.1;
      var pEnd = phrase[phrase.length-1].end + 0.3;
      if (t >= pStart && t < pEnd) {
        var activeWord = -1;
        for (var w = 0; w < phrase.length; w++) {
          if (t >= phrase[w].start && t < phrase[w].end + 0.1) {
            activeWord = w;
            break;
          }
        }
        return {phraseIdx: p, wordIdx: activeWord, phrase: phrase};
      }
    }
    return null;
  }
  
  // Render a single frame
  function renderFrame(t) {
    // Draw scene background with crossfade
    var sceneIdx = Math.floor(t / sceneDuration);
    sceneIdx = Math.min(sceneIdx, images.length - 1);
    var nextIdx = Math.min(sceneIdx + 1, images.length - 1);
    var sceneProgress = (t - sceneIdx * sceneDuration) / sceneDuration;
    
    // Draw current scene
    var img = images[sceneIdx];
    var scale = Math.max(1080 / img.width, 1920 / img.height);
    var w = img.width * scale;
    var h = img.height * scale;
    var x = (1080 - w) / 2;
    var y = (1920 - h) / 2;
    
    ctx.globalAlpha = 1;
    ctx.drawImage(img, x, y, w, h);
    
    // Crossfade to next scene in last 20% of scene
    if (sceneProgress > 0.8 && nextIdx !== sceneIdx) {
      var fadeProgress = (sceneProgress - 0.8) / 0.2;
      var nextImg = images[nextIdx];
      var ns = Math.max(1080 / nextImg.width, 1920 / nextImg.height);
      var nw = nextImg.width * ns;
      var nh = nextImg.height * ns;
      var nx = (1080 - nw) / 2;
      var ny = (1920 - nh) / 2;
      ctx.globalAlpha = fadeProgress;
      ctx.drawImage(nextImg, nx, ny, nw, nh);
    }
    
    // Dark overlay for text readability
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 1080, 1920);
    ctx.globalAlpha = 1;
    
    // Draw text
    var active = findActive(t);
    if (active) {
      var phrase = active.phrase;
      var text = phrase.map(function(w) { return w.word; }).join(' ');
      
      // Draw phrase text
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Measure and wrap text
      ctx.font = 'bold 72px sans-serif';
      var maxWidth = 960;
      var words_in_phrase = text.split(' ');
      var lines = [];
      var currentLine = '';
      
      for (var i = 0; i < words_in_phrase.length; i++) {
        var testLine = currentLine ? currentLine + ' ' + words_in_phrase[i] : words_in_phrase[i];
        if (ctx.measureText(testLine).width > maxWidth && currentLine) {
          lines.push(currentLine);
          currentLine = words_in_phrase[i];
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) lines.push(currentLine);
      
      var lineHeight = 90;
      var totalHeight = lines.length * lineHeight;
      var startY = 960 - totalHeight / 2;
      
      // Draw each line with word-level highlighting
      var wordOffset = 0;
      for (var l = 0; l < lines.length; l++) {
        var lineWords = lines[l].split(' ');
        var lineY = startY + l * lineHeight + lineHeight / 2;
        
        // Measure total line width for centering
        var lineWidth = ctx.measureText(lines[l]).width;
        var lineX = 540 - lineWidth / 2;
        
        for (var lw = 0; lw < lineWords.length; lw++) {
          var globalWordIdx = wordOffset + lw;
          var isActive = globalWordIdx === active.wordIdx;
          
          // Shadow
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = isActive ? 30 : 15;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 3;
          
          ctx.fillStyle = isActive ? '#FFD700' : 'rgba(255,255,255,0.95)';
          ctx.font = isActive ? 'bold 78px sans-serif' : 'bold 72px sans-serif';
          
          ctx.textAlign = 'left';
          ctx.fillText(lineWords[lw], lineX, lineY);
          
          lineX += ctx.measureText(lineWords[lw] + ' ').width;
        }
        wordOffset += lineWords.length;
      }
      
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }
    
    // Title at top
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '28px sans-serif';
    ctx.fillText('THE SEALED ROOM', 540, 120);
  }
  
  // Start recording
  status.textContent = 'Starting recorder...';
  window._dataChunks = [];
  
  var stream = canvas.captureStream(FPS);
  var recorder = new MediaRecorder(stream, {
    mimeType: 'video/webm;codecs=vp9',
    videoBitsPerSecond: 6000000
  });
  
  recorder.ondataavailable = function(e) {
    if (e.data.size > 0) window._dataChunks.push(e.data);
  };
  
  var donePromise = new Promise(function(resolve) { recorder.onstop = resolve; });
  recorder.start(1000); // collect data every 1s
  
  var startTime = performance.now();
  var frameDuration = 1000 / FPS;
  var totalFrames = Math.ceil(DURATION * FPS);
  
  for (var frame = 0; frame < totalFrames; frame++) {
    var t = frame / FPS;
    renderFrame(t);
    
    // Real-time pacing
    var targetTime = startTime + (frame + 1) * frameDuration;
    var now = performance.now();
    if (targetTime > now) {
      await new Promise(function(r) { setTimeout(r, targetTime - now); });
    }
    
    if (frame % FPS === 0) {
      var pct = Math.round(frame / totalFrames * 100);
      var elapsed = (performance.now() - startTime) / 1000;
      status.textContent = pct + '% (' + Math.round(elapsed) + 's / ' + Math.round(DURATION) + 's)';
      document.title = pct + '%';
    }
  }
  
  await new Promise(function(r) { setTimeout(r, 1000); });
  recorder.stop();
  await donePromise;
  
  var elapsed = (performance.now() - startTime) / 1000;
  status.textContent = 'Encoding...';
  
  // Convert to base64 chunks for extraction
  var blob = new Blob(window._dataChunks, {type: 'video/webm'});
  var buffer = await blob.arrayBuffer();
  var bytes = new Uint8Array(buffer);
  
  var chunkSize = 384 * 1024;
  window._b64 = [];
  for (var i = 0; i < bytes.length; i += chunkSize) {
    var slice = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
    var binary = '';
    for (var j = 0; j < slice.length; j++) binary += String.fromCharCode(slice[j]);
    window._b64.push(btoa(binary));
  }
  
  window._totalSize = bytes.length;
  window._numChunks = window._b64.length;
  window._elapsed = elapsed;
  status.textContent = 'DONE: ' + (bytes.length / 1024 / 1024).toFixed(1) + 'MB in ' + elapsed.toFixed(0) + 's';
  document.title = 'DONE';
})().catch(function(e) {
  window._error = e.message + '\n' + e.stack;
  document.title = 'ERROR';
  document.getElementById('status').textContent = 'ERROR: ' + e.message;
});
</script>
</body>
</html>
