<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrics Visualizer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        color: #fff;
        display: grid;
        margin: 0;
        place-items: center;
        min-height: 100vh;
      }

      figure {
        width: 100vw;
        height: 100vh;
        background: #000;
        position: relative;
        margin: 0 auto 20px;
        overflow: hidden;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      figcaption {
        font-size: 1cm;
        line-height: 1.5;
        font-family: "input sans", helvetica, sans-serif;

        display: flex;
        flex-wrap: wrap;
        justify-content: start;

        br {
          flex-basis: 100%;
          height: 0;
        }

        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        font-size: 48px;
        overflow-y: auto;
        padding: 20px;
        scrollbar-width: none;
      }

      hr {
        height: 1.5rem;
        border: none;
      }

      article::-webkit-scrollbar {
        display: none;
      }

      figure span {
        display: inline-block;
        margin: 0 8px;
        padding: 4px;
        cursor: pointer;
        user-select: none;
        will-change: opacity, color;
      }

      figure span:hover {
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.3);
      }

      menu {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(20px);
        max-width: 800px;
        margin: 0 auto;
      }

      button {
        padding: 10px 20px;
        font-family: inherit;
        font-size: 14px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #ddd;
      }
      button:disabled {
        background: #666;
        color: #999;
        cursor: not-allowed;
      }

      audio {
        width: 100%;
        max-width: 600px;
      }

      .recording {
        border: 3px solid #f00;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  <script type="module" crossorigin src="./chunk-d18pf9x7.js"></script></head>
  <body>
    <figure>
      <canvas width="1280" height="720"></canvas>
      <figcaption></figcaption>
    </figure>
    <audio></audio>
    <menu>
      <button>Export</button>
    </menu>

    
  </body>
</html>
