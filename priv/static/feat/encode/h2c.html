    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap');

      :root {
        --word-size: 5vh;
        --font-family: "EB Garamond", "Cormorant Garamond", Georgia, "Times New Roman", serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-family);
      }

      body.recording #debug { display: none; }

      #video {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }

      #scenes {
        position: absolute;
        inset: 0;
      }

      .scene {
        position: absolute;
        inset: -10%;
        width: 120%;
        height: 120%;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        opacity: 0;
        will-change: opacity, transform;
        transition: none;
      }

      #phrase-display {
        position: absolute;
        bottom: 14vh;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 3vh 8vw;
        z-index: 10;
      }

      #phrase-display .phrase-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.25em;
        line-height: 1.3;
      }

      #phrase-display .phrase-word {
        font-size: var(--word-size);
        font-weight: 500;
        font-style: italic;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 0.01em;
        transition: color 0.12s ease, font-weight 0.12s ease;
        text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.7);
      }

      #phrase-display .phrase-word.active {
        color: #ffffff;
        font-weight: 700;
        font-style: normal;
      }

      #phrase-display .phrase-word.spoken {
        color: rgba(255, 255, 255, 0.55);
        font-style: normal;
      }

      #title-overlay {
        position: absolute;
        top: 5vh;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 2.2vh;
        font-weight: 400;
        font-variant: small-caps;
        letter-spacing: 0.25em;
        color: rgba(255, 255, 255, 0.25);
        z-index: 10;
        text-shadow: 0 1px 8px rgba(0,0,0,0.8);
      }

      #vignette {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0,0,0,0.35) 0%,
          rgba(0,0,0,0.0) 20%,
          rgba(0,0,0,0.0) 45%,
          rgba(0,0,0,0.6) 70%,
          rgba(0,0,0,0.92) 100%
        );
        z-index: 5;
        pointer-events: none;
      }

      #debug {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 24px;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.3);
        font-family: monospace;
        z-index: 20;
      }

      /* Play button for preview mode */
      #play-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 30;
        cursor: pointer;
        background: rgba(0,0,0,0.4);
      }
      #play-overlay.hidden { display: none; }
      #play-overlay::after {
        content: '▶';
        font-size: 10vh;
        color: rgba(255,255,255,0.7);
        text-shadow: 0 2px 20px rgba(0,0,0,0.5);
      }
    </style>

        function findWordIndex(seconds) {
          let low = 0;
          let high = data.words.length - 1;
          while (low <= high) {
            const mid = Math.floor((low + high) / 2);
            const word = data.words[mid];
            if (seconds < word.start) { high = mid - 1; }
            else if (seconds >= word.end) { low = mid + 1; }
            else { return mid; }
          }
          return -1;
        }

          for (let i = 0; i < data.phrases.length; i++) {
            const p = data.phrases[i];
            if (seconds >= p.start - 0.15 && seconds < p.end + 0.4) return i;
          }
          for (let i = 0; i < data.phrases.length; i++) {
            if (data.phrases[i].start > seconds) return i;
          }
          return data.phrases.length - 1;

        function renderPhrase(phraseIdx, currentWordIdx) {
          if (phraseIdx < 0 || phraseIdx >= data.phrases.length) {
            phraseDisplay.innerHTML = '';
            currentPhraseIndex = -1;
            return;
          }

          const phrase = data.phrases[phraseIdx];

          if (phraseIdx !== currentPhraseIndex) {

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('h2c') !== '1') return;

  var FPS = 24;

  function waitForReady() {
    return new Promise(function(resolve) {
      (function check() {
        if (window.FrothVideo && window.FrothVideo.ready) resolve(window.FrothVideo);
        else setTimeout(check, 100);
      })();
    });

    var froth = await waitForReady();
    var data = froth.data;
    var duration = data.duration_s;
    var totalFrames = Math.ceil(duration * FPS);

    var el = document.body;
    var W = 1080, H = 1920;

    document.title = 'h2c:configuring';

    var codecConfig = { codec: 'avc1.42001f', width: W, height: H, bitrate: 6000000, framerate: FPS };
    var support = await VideoEncoder.isConfigSupported(codecConfig);

      codecConfig.codec = 'avc1.640028';
      support = await VideoEncoder.isConfigSupported(codecConfig);
    }

      hardwareAcceleration: 'prefer-hardware',

    });

      var canvas = await html2canvas(el, {

        scale: 1,
        useCORS: true,
        logging: false,
        backgroundColor: '#0d1117'
      });

        timestamp: Math.round(t * 1000000),

      encoder.encode(frame, { keyFrame: f % (FPS * 2) === 0 });

      if (f % FPS === 0) {
        var pct = Math.round(f / totalFrames * 100);
        var elapsed = (performance.now() - startTime) / 1000;
        var rendered = f / FPS;
        var speed = rendered > 0 ? (rendered / elapsed).toFixed(1) : '?';
        document.title = 'h2c:encoding:' + pct + '%:' + speed + 'x';

    encoder.close();
    muxer.finalize();

    var bytes = new Uint8Array(buffer);

      for (var j = 0; j < slice.length; j++) bin += String.fromCharCode(slice[j]);

      totalSize: bytes.length,
      numChunks: window._b64.length,
      mimeType: 'video/mp4',
      elapsed: elapsed,
      speed: (duration / elapsed).toFixed(1) + 'x',
      frames: totalFrames,
      duration: duration,
      method: 'html2canvas-webcodecs'
    };
    document.title = 'h2c:done:' + (bytes.length/1024/1024).toFixed(1) + 'MB:' + (duration/elapsed).toFixed(1) + 'x';
  }

    window._encodeError = (e && e.message ? e.message : String(e)) + ' | ' + (e && e.stack ? e.stack : '');
